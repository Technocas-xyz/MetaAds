services:
  postgres:
    image: postgres:16
    container_name: ads-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ads_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ads_password}
      POSTGRES_DB: ${POSTGRES_DB:-ads_supervisor}
    ports:
      - "5432:5432"
      
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_user -d ads_supervisor"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ads-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: ads-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: ads-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ads-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
      # Optional MetaAds-only AI keys (git-ignored), e.g. GROQ_API_KEY / GROQ_API_KEY_2
      - path: ./backend/.env.ai
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ads_user:ads_password@postgres:5432/ads_supervisor
      DATABASE_SYNC_URL: postgresql://ads_user:ads_password@postgres:5432/ads_supervisor
      SSO_SHARED_SECRET: ${SSO_SHARED_SECRET:-}
      # Persisted browser session for the Ad Library scraper (backend_runtime volume)
      META_STORAGE_STATE_PATH: /app/runtime/meta_session.json
      # Scraper browser leaves via the server's IPv6 address (see egress-proxy)
      SCRAPER_PROXY_URL: http://172.22.0.1:8899
    # Chromium needs more shared memory than Docker's default 64MB
    shm_size: "1gb"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - backend_runtime:/app/runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # Sends the scraper's traffic out over IPv6. Host network so it can use the
  # server's IPv6 address; listens only on the Docker bridge, not publicly.
  egress-proxy:
    image: python:3.11-slim
    container_name: ads-egress-proxy
    network_mode: host
    environment:
      LISTEN_HOST: 172.22.0.1
      LISTEN_PORT: "8899"
    volumes:
      - ./ops/ipv6_egress_proxy.py:/ipv6_egress_proxy.py:ro
    command: python /ipv6_egress_proxy.py
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ads-frontend
    ports:
      - "8096:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  backend_runtime:
